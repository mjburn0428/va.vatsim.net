events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10M;
    # Bound anonymous event requests, including submissions, per client connection IP.
    limit_req_zone $binary_remote_addr zone=va_events:10m rate=10r/m;
    upstream va_events_backend {
        server flask.vsoa.svc.cluster.local:5000;
    }

    server {
        listen 80;
        server_name va.vatsim.net;

        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        root /var/www/va;
        index index.html;

        location ~ /\.env {
                deny all;
            return 403;
        }

#       Documentation endpoint

            location /docs/ {
            proxy_pass http://flask.vsoa.svc.cluster.local:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

#       Audit Processor

        location /ap/ {
            proxy_pass http://flask.vsoa.svc.cluster.local:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

            location /ap/static {
            alias /var/www/va/static/;
        }

#       API endpoints

        location = /api/team {
            proxy_pass http://flask.vsoa.svc.cluster.local:5000/public-team;
            proxy_set_header Host $host;
        }

        location = /va-portal { return 302 /va-portal/; }
        location /va-portal/ {
            client_max_body_size 6m;
            proxy_pass http://flask.vsoa.svc.cluster.local:5000;
            proxy_set_header Host $host;
        }

        location = /api/audit-statistics {
            proxy_pass http://flask.vsoa.svc.cluster.local:5000/public-audit-statistics;
            proxy_set_header Host $host;
        }

        # Keep the rate-limited public route as the only events API entry point.
        location ~ ^/(ap|docs)/public-events(?:/|$) {
            return 404;
        }

        location = /api/events {
            client_max_body_size 6m;
            limit_req zone=va_events burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://flask.vsoa.svc.cluster.local:5000/public-events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ "^/api/events/([0-9a-fA-F-]{36})/banner$" {
            proxy_pass http://va_events_backend/public-events/$1/banner;
            proxy_set_header Host $host;
        }

        location /api/partners {
            proxy_pass http://ams.vsoa.svc.cluster.local:8055/items/Partner_List;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /api/logo {
            proxy_pass http://ams.vsoa.svc.cluster.local:8055/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /api/auditors {
            proxy_pass http://ams.vsoa.svc.cluster.local:8055/items/Audit_Managers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /assets/ {
            proxy_pass http://ams.vsoa.svc.cluster.local:8055/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            return 403;
        }

        location /admin/ {
            proxy_pass http://ams.vsoa.svc.cluster.local:8055/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

#       Audit Management System

        location /ams/ {
            proxy_pass http://ams.vsoa.svc.cluster.local:8055/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Original-URI $request_uri;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;

        }
    }
}
